plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omar.wheel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.omar.wheel'
        minSdk 22
        targetSdk 34
        // Each GitHub build gets a higher number so updates install over the old one.
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName '1.0'
    }

    signingConfigs {
        release {
            // A fixed key, so every new build can update the installed app.
            storeFile file('wheel.keystore')
            storePassword 'wheelwheel'
            keyAlias 'wheel'
            keyPassword 'wheelwheel'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}
